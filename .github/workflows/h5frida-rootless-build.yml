name: Experimental h5frida 17 Rootless build

on:
  push:
    branches:
      - h5frida-rootless-frida17-20261031
    paths:
      - 'tools/h5frida/**'
      - '.github/workflows/h5frida-rootless-build.yml'
  workflow_dispatch:

concurrency:
  group: h5frida-rootless-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout build scripts (this branch)
        uses: actions/checkout@v4

      - name: Checkout H5GG official plugin sources (read only)
        uses: actions/checkout@v4
        with:
          repository: H5GG/H5GG
          ref: main
          path: upstream
          fetch-depth: 1
          sparse-checkout: |
            pluginDemo/h5frida15.1.24
            ldid-master

      - name: Install Theos and register Apple iOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          ln -s "$sdk" "$RUNNER_TEMP/theos/sdks/$(basename "$sdk")"
          brew install ldid
          command -v ldid
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=rootless" >> "$GITHUB_ENV"

      - name: Compile against official Frida 17.25.0 iOS arm64 devkit
        shell: bash
        run: |
          set -o pipefail
          bash tools/h5frida/build.sh

      - name: Upload logs and any produced dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5frida17-rootless-build-diagnostics
          path: build-results/
          if-no-files-found: warn
